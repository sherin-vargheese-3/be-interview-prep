spring:
  application:
    name: be-interview-prep
  # In-memory H2, unique per Spring context (tests can run several contexts side by side).
  # LOCK_TIMEOUT lets concurrent transactions queue on a busy row instead of failing fast.
  # For PostgreSQL, set spring.datasource.url/username/password via environment variables.
  datasource:
    url: jdbc:h2:mem:prep-${random.uuid};LOCK_TIMEOUT=10000
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100        # larger requested sizes are capped to 100
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

# Secrets come only from the environment; nothing sensitive is committed.
app:
  jwt:
    secret: ${JWT_SECRET:}          # required, >= 32 characters; startup fails otherwise
    ttl: 15m
    issuer: be-interview-prep
  admin:
    email: ${ADMIN_EMAIL:}          # optional: seeds the first ADMIN when both are set
    password: ${ADMIN_PASSWORD:}
